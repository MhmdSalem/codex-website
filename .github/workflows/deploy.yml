name: Deploy

# Every push to main is checked (types, lint, production build) and, when it
# passes and the server secrets are set, deployed to the VPS over SSH.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      server IP or hostname                       (required)
#   VPS_USER      SSH user that owns the site folder          (required)
#   VPS_SSH_KEY   private key whose public half is in that
#                 user's ~/.ssh/authorized_keys               (required)
#   VPS_PORT      SSH port                                    (optional, 22)
#   VPS_APP_DIR   site folder on the server, e.g.
#                 /home/codex/htdocs/codex-tech.ai            (optional, ~/codex-website)
#
# Until VPS_HOST is set the deploy job skips itself instead of failing, so the
# checks still run and the repository stays green.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to server
    needs: check
    runs-on: ubuntu-latest
    env:
      HAS_SERVER: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: Server not configured
        if: env.HAS_SERVER != 'true'
        run: |
          echo "::notice::VPS_HOST is not set, so nothing was deployed. Add the secrets listed at the top of .github/workflows/deploy.yml."

      - name: Deploy over SSH
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR,REPO_URL
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-$HOME/codex-website}"
            # The script lives in the repo, so fetch it from the commit being
            # deployed rather than trusting whatever copy the server has.
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/deploy.sh" -o /tmp/codex-deploy.sh
            APP_DIR="$APP_DIR" REPO_URL="$REPO_URL" bash /tmp/codex-deploy.sh
