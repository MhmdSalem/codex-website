name: Reset admin password on VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to Hostinger VPS"]
    types: [completed]

jobs:
  reset:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Reset password on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          RESET_ADMIN_PASSWORD: ${{ secrets.RESET_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: RESET_ADMIN_PASSWORD
          script_stop: true
          script: |
            set -e
            cd ~/codex-website
            git pull origin main
            if [ -z "$RESET_ADMIN_PASSWORD" ]; then
              echo "Missing RESET_ADMIN_PASSWORD repository secret"
              exit 1
            fi
            sed -i "s/^SEED_ADMIN_PASSWORD=.*/SEED_ADMIN_PASSWORD=${RESET_ADMIN_PASSWORD}/" .env.local
            npm run reset-admin-password
            echo "Done — password reset for $(grep SEED_ADMIN_EMAIL .env.local | cut -d= -f2)"
